name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Check toolchain
        run: swift --version
      - name: Resolve the reviewed dependency lockfile
        run: swift package resolve --force-resolved-versions
      - run: swift test --skip-update
      - run: swift build -c release --skip-update
      - run: python3 scripts/check-site.py
